<body>
<div id="stage"><canvas id="game" width="384" height="216"></canvas>
  <div id="touch">
    <div id="stickBase"><div id="stickKnob"></div></div>

      <button data-b="cycle" class="tb sm">L</button><button data-b="block" class="tb sm">R</button><button data-b="transform" class="tb sm">TF</button>

  <div id="rotate" class="overlay">Turn your phone sideways</div>
</div>
